[build-system]
requires = ["setuptools>=77.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "stegaQR"
version = "0.2.0"
description = "Neural steganographic data embedding in QR codes with switchable channel modes"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{name = "Muntaser Syed", email = "jemsbhai@gmail.com"}]
requires-python = ">=3.10,<3.13"
keywords = ["QR code", "steganography", "watermarking", "error correction", "deep learning"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Security :: Cryptography",
]
dependencies = [
    "numpy>=1.24",
    "pillow>=9.0",
    "opencv-python>=4.0",
    "qrcode[pil]>=7.0",
    "scipy>=1.11",
    "torch>=2.0",
    "pyzbar>=0.1.9",
]

[project.urls]
Homepage = "https://github.com/jemsbhai/stegaQR"
Repository = "https://github.com/jemsbhai/stegaQR"
Issues = "https://github.com/jemsbhai/stegaQR/issues"

[project.optional-dependencies]
dev = [
    "build>=1.2",
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "mypy>=1.0",
    "twine>=5.0",
]
analysis = [
    "matplotlib>=3.7",
    "seaborn>=0.12",
    "pandas>=2.0",
    "scikit-learn>=1.3",
]

[project.scripts]
stegaqr = "stegaqr.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
stegaqr = ["assets/*.pt"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "gpu: marks tests requiring GPU",
]

[tool.coverage.run]
source = ["src/stegaqr"]
branch = true

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true
